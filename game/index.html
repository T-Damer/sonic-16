<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sonic 16 Godot previews</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
      body { background: #081522; color: #d9f2ff; font: 16px/1.5 system-ui, sans-serif; }
      main { box-sizing: border-box; max-width: 48rem; margin: 4rem auto; padding: 0 1.25rem; }
      code { color: #ffd154; }
    </style>
  </head>
  <body>
    <main id="status"><h1>Sonic 16 Godot previews</h1><p>Loading preview…</p></main>
    <script>
      const status = document.getElementById('status');
      const match = location.hash.match(/^#\/v1\/([0-9a-f]{7,40})\/?$/i);
      const openRevision = (revision) => {
        const frame = document.createElement('iframe');
        frame.src = `./v1/${revision}/index.html`;
        frame.title = `Sonic 16 Godot build ${revision}`;
        frame.allow = 'autoplay; fullscreen; gamepad';
        status.replaceWith(frame);
      };
      if (match) {
        openRevision(match[1].toLowerCase());
      } else {
        fetch('./latest.json', { cache: 'no-store' })
          .then((response) => response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`)))
          .then((latest) => location.replace(`#/v1/${latest.shortCommit}`))
          .catch((error) => {
            status.innerHTML = `<h1>Sonic 16 Godot previews</h1><p>Use <code>#/v1/&lt;commit&gt;</code>.</p><p>${error}</p>`;
          });
      }
    </script>
  </body>
</html>
