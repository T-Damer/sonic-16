<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Concept card: item monitor on a post, green screen with gold ring icon, image-to-3D input. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8eef3"/>
      <stop offset="0.6" stop-color="#c2ccd6"/>
      <stop offset="1" stop-color="#8a96a2"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a7480"/>
      <stop offset="1" stop-color="#39404a"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.42" cy="0.35" r="0.95">
      <stop offset="0" stop-color="#54e88a"/>
      <stop offset="0.7" stop-color="#1ea94a"/>
      <stop offset="1" stop-color="#0c5c26"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.5" stop-color="#ffc61e"/>
      <stop offset="1" stop-color="#a87b06"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#e9eaee"/>
  <ellipse cx="512" cy="908" rx="180" ry="28" fill="#000000" opacity="0.14"/>

  <!-- post + base -->
  <rect x="478" y="700" width="68" height="180" rx="20" fill="url(#dark)"/>
  <path d="M400 880 L624 880 L648 908 L376 908 Z" fill="url(#dark)"/>

  <!-- monitor box -->
  <rect x="292" y="300" width="440" height="420" rx="46" fill="url(#shell)"/>
  <rect x="292" y="300" width="440" height="60" rx="30" fill="#f4f8fb"/>
  <!-- side vents -->
  <rect x="316" y="560" width="16" height="120" rx="8" fill="#8a96a2"/>
  <rect x="692" y="560" width="16" height="120" rx="8" fill="#8a96a2"/>

  <!-- screen -->
  <rect x="352" y="356" width="320" height="300" rx="26" fill="#1b1f26"/>
  <rect x="366" y="370" width="292" height="272" rx="18" fill="url(#screen)"/>

  <!-- gold ring icon on screen -->
  <ellipse cx="512" cy="506" rx="92" ry="112" fill="none" stroke="url(#ring)" stroke-width="42"/>
  <ellipse cx="488" cy="478" rx="60" ry="80" fill="none" stroke="#fff6cf" stroke-width="10" opacity="0.8"/>

  <!-- scanline sheen -->
  <path d="M380 386 L560 386 L430 640 L380 640 Z" fill="#ffffff" opacity="0.10"/>
</svg>
